[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
# Masque la barre d'outils (icone GitHub / "Fork") sur Streamlit Cloud.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
